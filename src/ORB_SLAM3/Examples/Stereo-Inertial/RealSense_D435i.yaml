%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Rectified Camera calibration (OpenCV)
# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 388.0247877335
Camera1.fy: 388.20912382104615
Camera1.cx: 320.0414727651975
Camera1.cy: 236.10871291304363
Camera1.k1: 0.004802738594995444
Camera1.k2: -0.004096483737692108
Camera1.p1: -0.00011951637343143791
Camera1.p2: -0.0003240935573962454
Camera.width: 640
Camera.height: 480

Camera2.fx: 387.95978590967104
Camera2.fy: 388.25569532939056
Camera2.cx: 319.88738914283164
Camera2.cy: 235.94665544870665
Camera2.k1: 0.004160705030161992
Camera2.k2: -0.003095388949878831
Camera2.p1: -0.00013222614641139854
Camera2.p2: -0.0006495097494818348

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.9999998293849033, -2.2512601524996657e-05, 0.0005837151283779142, -0.05014759463162955,
         2.2153180459029724e-05, 0.9999998101826998, 0.0006157465429267042, -4.196934478045919e-05,
         -0.0005837288796352445, -0.0006157335067244712, 0.9999996400663591, -0.00012698728445807345,
         0.0, 0.0, 0.0, 1.0]

# Transformation from body-frame (imu) to left camera
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [1.0, 0.0, 0.0, -0.005,
          0.0, 1.0, 0.0, -0.005,
          0.0, 0.0, 1.0, 0.0117,
          0.0, 0.0, 0.0, 1.0]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 1.5e-3 # 2.44e-4 #1e-3 # rad/s^0.5
IMU.NoiseAcc: 1.8e-3 # 1.47e-3 #1e-2 # m/s^1.5
IMU.GyroWalk: 1.6e-5 # rad/s^1.5
IMU.AccWalk: 2.9e-5 # m/s^2.5
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1250

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

